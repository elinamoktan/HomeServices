<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Appointment Confirmed! ✅</h2>
        
        <div style="background: #28a745; color: white; padding: 15px; border-radius: 8px; text-align: center; margin: 20px 0;">
            <h3 style="margin: 0;">Your appointment has been confirmed!</h3>
        </div>
        
        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;">
            <h3 style="color: #007bff; margin-top: 0;">Appointment Details</h3>
            <p><strong>Worker:</strong> {{ worker_name }}</p>
            <p><strong>Service:</strong> {{ service_name }}</p>
            <p><strong>Price:</strong> {{ price_info }}</p>
            <p><strong>Date & Time:</strong> {{ appointment_date }}</p>
            <p><strong>Location:</strong> {{ location }}</p>
        </div>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ site_url }}/customer/appointments/" style="background: #007bff; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">
                View My Appointments
            </a>
        </div>
    </div>
</body>
</html>
